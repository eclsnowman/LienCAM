appId: com.liencam.desktop
productName: LienCAM
copyright: Copyright (c) LienCAM contributors

directories:
  output: release

files:
  - dist/**/*
  - electron/main.cjs
  - electron/agentChannel.cjs
  - electron/preload.cjs
  # WO-3010: the MCP server and the stdio shim an MCP client launches.
  - electron/mcp/**/*
  - package.json
  # WO-2334: the app runs from the bundled dist/ and loads nothing from
  # node_modules, so leave out native LGPL binaries it never uses: OpenCAMLib's
  # Node builds (the app bundles its browser build) and sharp / libvips, which
  # the npm closure can reach through manifold-3d's glTF tooling.
  - "!**/node_modules/@opencamlib/opencamlib/build/**"
  - "!**/node_modules/sharp/**"
  - "!**/node_modules/@img/**"

extraResources:
  # WO-2334: the licence, the third-party licences and the source offer for
  # our patched OCCT, as plain files in resources/ (dist/ carries them too).
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
  - from: NOTICE-GEO9.md
    to: NOTICE-GEO9.md
  - from: patches
    to: patches
  - from: pendant
    to: pendant
    filter:
      - "**/*"
      - "!uccnc-bridge/bin/**/*"
      - "!uccnc-bridge/**/*.exe"
      - "!uccnc-bridge/**/*.dll"
      - "!uccnc-bridge/obj/**/*"
      - "!uc100net/**/*"
      - "!uccnc-bridge/native/**/*"
  # WO-2407: preserve the checkout-relative theme path used by the phone server.
  # Copy the canonical tokens; do not maintain a separate pendant theme.
  - from: src/theme/tokens.css
    to: src/theme/tokens.css

asar: true
# WO-3010: the shim runs under ELECTRON_RUN_AS_NODE=1, launched by the MCP client
# with a path on disk, so it must sit outside the archive
# (resources/app.asar.unpacked/electron/mcp/liencam-mcp.cjs).
asarUnpack:
  - electron/mcp/liencam-mcp.cjs
npmRebuild: false
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

win:
  icon: build/icons/icon.ico
  target:
    - nsis
    - portable

nsis:
  artifactName: "${productName}-${version}-${os}-${arch}-setup.${ext}"
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LienCAM

portable:
  artifactName: "${productName}-${version}-${os}-${arch}-portable.${ext}"

mac:
  # WO-3064: arm64 and Intel are separate builds (one set of files per CPU),
  # not a universal binary: the universal merge doubles the download and the
  # app has no native code that would need it. Both are unsigned and untested.
  icon: build/icons/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.productivity

linux:
  # WO-2894 route A: stage the unchanged Windows-built executable before the
  # Linux package build. Never ship UC100.dll/FTD2XX.dll or a machine config.
  # Global pendant filters still exclude binaries for Windows and macOS.
  extraResources:
    - from: pendant/uccnc-bridge/bin/liencam-bridge.exe
      to: pendant/uccnc-bridge/bin/liencam-bridge.exe
    # Stage the complete self-contained bundle for this package's CPU before
    # packaging. Route B release still requires the real-board T3.
    - from: pendant/uc100net/publish/linux-${arch}
      to: pendant/uccnc-bridge/native/linux-${arch}
  icon: build/icons/png
  target:
    - AppImage
    - tar.gz
    # WO-3064: native packages, same build as the AppImage; untested.
    - deb
    - rpm
  category: Engineering
  executableName: liencam
  maintainer: LienCAM contributors <noreply@liencam.invalid>
  synopsis: Sketch, model, toolpath, simulate, post and run a CNC machine
