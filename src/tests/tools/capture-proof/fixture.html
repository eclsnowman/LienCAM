<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WO-092 capture provenance proof</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #e5e7eb; font: 24px system-ui; }
      main { width: 520px; padding: 48px; border: 4px solid #22d3ee; background: #1f2937; text-align: center; }
      body.changed { background: #3f1d38; }
      body.changed main { border-color: #fb7185; }
    </style>
  </head>
  <body data-branch-proof="WO-092">
    <main>
      <h1>WO-092 live branch fixture</h1>
      <p id="state">initial view</p>
      <button id="change" type="button">Change view</button>
    </main>
    <script>
      document.querySelector('#change').addEventListener('click', () => {
        document.body.classList.add('changed')
        document.querySelector('#state').textContent = 'changed view'
      })
    </script>
  </body>
</html>
