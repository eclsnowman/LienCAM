name: Publish repository wiki

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# The wiki has one default branch, shared by tag and manual runs.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      # Initialise the wiki with one page on GitHub before the first run.
      - name: Publish docs/wiki
        run: node tools/release/wiki-publish.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
