name: Build native Linux bridge bundles

# Build artifacts only. The canonical release workflow must incorporate these
# after the real-board T3 release check; this workflow never publishes a release.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained native bridge
        shell: bash
        run: |
          dotnet publish pendant/uccnc-bridge/uccnc-bridge-net.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -o "pendant/uc100net/publish/${{ matrix.rid }}"
          tar -C "pendant/uc100net/publish/${{ matrix.rid }}" -czf "liencam-bridge-${{ matrix.rid }}.tar.gz" .
      - name: Save native bridge bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-bridge-${{ matrix.rid }}
          path: liencam-bridge-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
