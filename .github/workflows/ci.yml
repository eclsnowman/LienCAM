name: CI

on:
  push:
  pull_request:

# Fork approval is a repository setting, not a privileged PR trigger.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # No engines or .nvmrc pin yet; match the public Pages workflow.
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Public tests
        run: npm run test:public

  windows-build:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build
        run: npm run build
