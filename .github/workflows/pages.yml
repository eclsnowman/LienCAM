name: Publish site and browser demo

on:
  # Publishing the drafted release rebuilds the site, so the Download page lists its real files. A tag push does not:
  # its release is still a draft then, so the fill step had nothing real to show and failed on every new tag.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (v*)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize each build and deployment in the shared Pages environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" == v* && "$RELEASE_TAG" != */* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - name: Check out the release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install pinned dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The installers' sizes and checksums exist only after the tag is built, so the Download page is filled at
      # deploy time from the selected published release. The filler comes from this workflow's own commit, which may
      # be newer than the release tag being built.
      - name: Fill the Download page from the selected published release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
          TOOL_SHA: ${{ github.workflow_sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          tool="$RUNNER_TEMP/site-releases"
          mkdir -p "$tool/tools/release" "$tool/tools/lib" "$tool/site"
          git fetch --quiet --depth 1 "$REPOSITORY_URL" "$TOOL_SHA"
          git show FETCH_HEAD:tools/release/site-releases.mjs > "$tool/tools/release/site-releases.mjs"
          git show FETCH_HEAD:tools/lib/is-main.mjs > "$tool/tools/lib/is-main.mjs"
          cp site/download.html "$tool/site/download.html"
          node "$tool/tools/release/site-releases.mjs" --tag "$RELEASE_TAG" --output site/download.html
          ! grep -q 'class="preview-note"' site/download.html
      - name: Build the site and browser demo
        run: npm run build:pages
      - name: Upload Pages output
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
