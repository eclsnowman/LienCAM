name: Build native macOS bridge (alpha, untested on macOS)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-bridge:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Apple Silicon runtime (alpha, untested on macOS)
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          dotnet publish pendant/uccnc-bridge/uccnc-bridge-net.csproj -c Release -r osx-arm64 --self-contained true -o pendant/uc100net/publish/osx-arm64
          root=pendant/uc100net/publish/osx-arm64
          test -x "$root/liencam-bridge"
          file "$root/liencam-bridge" | grep 'Mach-O 64-bit executable arm64'
          for f in libcoreclr.dylib libhostfxr.dylib libhostpolicy.dylib liencam-bridge.dll liencam-bridge.deps.json liencam-bridge.runtimeconfig.json; do test -s "$root/$f"; done
          test -n "$(find "$root/boards" -name '*.json' -print -quit)"
          tar -C "$root" -czf liencam-bridge-osx-arm64.tar.gz .
      - name: Save native bridge bundle (alpha, untested on macOS)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-bridge-osx-arm64
          path: liencam-bridge-osx-arm64.tar.gz
          if-no-files-found: error
